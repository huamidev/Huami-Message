# Cloudflare 的部署配置。
#
# 【为什么必须有这个文件】
#
# 你在 Cloudflare 后台看到的部署命令是 `npx wrangler deploy`。
# 那条命令**需要知道"要发布的东西在哪"** —— 不告诉它的话，
# 它会去找一个叫 main 的入口脚本（那是 Worker 的写法），
# 而这里是一个纯静态站点，没有那个文件。
#
# 于是表现是：构建"成功"了，但网址打不开 / 是空的。
#
# 下面 [assets] 就是那句"要发布的东西在这里"。
#
# 【name 必须和后台的项目名一模一样】
#
# 对不上的话，它不会更新你那个项目，而是**另建一个新的** ——
# 然后你会盯着原来那个网址想"为什么没变化"。

# ⚠️ **必须和 Cloudflare 后台的项目名一模一样。**
#
# 用户把项目从 huami-message-web 改名成了 huami-message，
# 所以这里也要跟着改 —— 对不上的话，它不会更新那个项目，
# 而是**另建一个新的**，然后你会盯着原来那个网址想"为什么没变化"。
#
# 以后再改名的话，这个文件也要改，然后重新构建一次。
name = "huami-message"
compatibility_date = "2025-01-01"

[assets]
# 构建产物（npm run build 的输出目录）
directory = "./dist"

# 单页应用的回退：任何匹配不到文件的路径都返回 index.html。
# 这个 App 现在没有客户端路由，但以后加了的话，
# 少了这一行就会出现"刷新一下就 404"——
# 而那是个很难第一时间想到原因的问题。
not_found_handling = "single-page-application"
